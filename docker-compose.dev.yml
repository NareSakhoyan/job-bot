# Database only. Use this when running the app on the host for fast HMR:
#
#   docker compose -f docker-compose.dev.yml up -d
#   pnpm install && pnpm db:migrate && pnpm db:seed && pnpm dev
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobbot}
      POSTGRES_DB: ${POSTGRES_DB:-jobbot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobbot} -d ${POSTGRES_DB:-jobbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
